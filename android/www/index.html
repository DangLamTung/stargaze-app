<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StarGaze</title>
  <style>
    body { margin: 0; background: #020618; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: system-ui; }
    .loader { text-align: center; color: #e2e8f0; }
    .loader h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .loader p { color: #64748b; font-size: 0.9rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(100,116,139,0.2); border-top-color: #00d4ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <h1>🔭 StarGaze</h1>
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>
</body>
</html>
