<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Stellarium Debug Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'SF Mono', 'Fira Code', monospace; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }

    /* Small toggle button */
    #toggleBtn {
      position: fixed; bottom: 8px; right: 8px; z-index: 15;
      background: rgba(0,0,0,0.7); color: #0f0; border: 1px solid rgba(0,255,136,0.3);
      border-radius: 50%; width: 36px; height: 36px; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Panel — hidden by default */
    #panel {
      position: fixed; bottom: 8px; right: 52px; z-index: 10;
      background: rgba(0,0,0,0.85); color: #0f0; font-size: 11px;
      border: 1px solid rgba(0,255,136,0.25); border-radius: 8px;
      padding: 8px; width: 290px; max-height: 60vh; overflow-y: auto;
      display: none;
    }
    #panel.show { display: block; }
    #panel h3 { margin: 0 0 4px; font-size: 13px; color: #00ff88; }
    #panel label { display: block; margin-top: 4px; color: #8f8; font-size: 10px; text-transform: uppercase; }
    #panel input[type=range] { width: 100%; accent-color: #00ff88; }
    #panel input[type=number] {
      width: 70px; background: #111; color: #0f0; border: 1px solid #333;
      padding: 2px 4px; font-size: 11px; font-family: monospace;
    }
    #panel button {
      background: #111; color: #0f0; border: 1px solid #333;
      padding: 3px 8px; margin: 1px; font-size: 10px; cursor: pointer;
      border-radius: 3px;
    }
    #panel button:hover { background: #222; border-color: #00ff88; }
    #panel button.active { background: #0f0; color: #000; }
    .row { display: flex; align-items: center; gap: 4px; margin-top: 1px; }
    .val { color: #0ff; min-width: 35px; text-align: right; font-size: 10px; }
    hr { border: 0; border-top: 1px solid rgba(0,255,136,0.12); margin: 5px 0; }
    #debug { color: #ff0; font-size: 9px; white-space: pre-wrap; margin-top: 4px; line-height: 1.3; }

    /* HUD */
    #hud {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 5;
      color: #0f0; font-size: 14px; font-family: monospace;
      background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 6px;
      pointer-events: none; text-align: center;
    }

    #status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 20; color: #0f0; font-size: 18px; font-weight: bold;
      background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 6px;
      pointer-events: none; transition: opacity 0.5s;
    }
    #status.done { opacity: 0; }
  </style>
</head>
<body>
  <div id="status">Loading engine...</div>
  <canvas id="sky"></canvas>
  <div id="hud"></div>
  <button id="toggleBtn" onclick="var p=document.getElementById('panel');p.classList.toggle('show');this.textContent=p.classList.contains('show')?'✕':'⚙'">⚙</button>

  <div id="panel">
    <h3>🔭 Debug</h3>

    <label>📍 Latitude</label>
    <div class="row">
      <input type="number" id="lat" value="10.7626" step="0.0001" min="-90" max="90" onchange="applyAll()" />
      <span style="color:#888;">(-90..90)</span>
    </div>

    <label>📍 Longitude</label>
    <div class="row">
      <input type="number" id="lon" value="106.6602" step="0.0001" min="-180" max="180" onchange="applyAll()" />
      <span style="color:#888;">(-180..180)</span>
    </div>

    <label>🧭 Yaw (azimuth)</label>
    <div class="row">
      <input type="range" id="yaw" min="0" max="360" value="0" oninput="applyYaw()" />
      <span class="val" id="yawVal">0°</span>
    </div>
    <div class="row">
      <button onclick="setYawQuick(0)">N</button>
      <button onclick="setYawQuick(90)">E</button>
      <button onclick="setYawQuick(180)">S</button>
      <button onclick="setYawQuick(270)">W</button>
      <button onclick="setYawQuick(45)">NE</button>
      <button onclick="setYawQuick(225)">SW</button>
    </div>

    <label>📐 Pitch (elevation)</label>
    <div class="row">
      <input type="range" id="pitch" min="-90" max="90" value="45" oninput="applyPitch()" />
      <span class="val" id="pitchVal">45°</span>
    </div>
    <div class="row">
      <button onclick="setPitchQuick(0)">Horizon</button>
      <button onclick="setPitchQuick(45)">45°</button>
      <button onclick="setPitchQuick(90)">Zenith</button>
      <button onclick="setPitchQuick(-10)">-10°</button>
    </div>

    <hr />

    <label>🕐 Time offset</label>
    <div class="row">
      <input type="range" id="timeOff" min="-720" max="720" value="0" step="15" oninput="applyTime()" />
      <span class="val" id="timeVal">now</span>
    </div>

    <label>🌫️ Opacity</label>
    <div class="row">
      <input type="range" id="opacity" min="20" max="100" value="100" oninput="applyOpacity()" />
      <span class="val" id="opacityVal">100%</span>
    </div>

    <hr />

    <label>Toggles</label>
    <div class="row" style="flex-wrap:wrap;">
      <button id="btnGrid" class="active" onclick="toggle('lines.equatorial','lines.azimuthal',this)">Grid</button>
      <button id="btnConst" class="active" onclick="toggle('constellations',null,this)">Constellations</button>
      <button id="btnLabels" class="active" onclick="toggle('stars.hints','planets.hints',this)">Labels</button>
      <button id="btnAtmo" onclick="toggle('atmosphere',null,this)">Atmo</button>
      <button id="btnGround" class="active" onclick="toggle('landscapes',null,this)">Ground</button>
      <button id="btnMilky" class="active" onclick="toggle('milkyway',null,this)">MilkyWay</button>
    </div>

    <hr />

    <label>🔬 Sensor Sim</label>
    <div class="row">
      <button id="btnSensor" onclick="startSensorSim()">Start Sensor</button>
      <button onclick="stopSensorSim()">Stop</button>
    </div>

    <hr />

    <div id="debug">
      Waiting for engine...
    </div>
  </div>

  <script src="lib/stellarium-web-engine.js?v=2"></script>
  <script>
    var stel = null, engineReady = false;
    var statusEl = document.getElementById('status');
    var debugEl = document.getElementById('debug');
    var hudEl = document.getElementById('hud');
    var baseMJD = 0;

    function log(msg) { console.log('[DEBUG]', msg); }

    function updateDebug() {
      if (!engineReady || !stel || !stel.core) return;
      var obs = stel.core.observer;
      var yawDeg = (obs.yaw * 180 / Math.PI);
      var pitchDeg = (obs.pitch * 180 / Math.PI);
      var latDeg = (obs.latitude || 0) * 180 / Math.PI;
      var lonDeg = (obs.longitude || 0) * 180 / Math.PI;
      debugEl.textContent =
        'yaw:' + yawDeg.toFixed(1) + '° pitch:' + pitchDeg.toFixed(1) + '°\n' +
        'lat:' + latDeg.toFixed(4) + ' lon:' + lonDeg.toFixed(4) + '\n' +
        'utc:' + (obs.utc||0).toFixed(4) + ' grid:' + ((stel.core.lines&&stel.core.lines.equatorial)?stel.core.lines.equatorial.visible:'?') +
        ' const:' + ((stel.core.constellations)?stel.core.constellations.lines_visible:'?') +
        ' gnd:' + ((stel.core.landscapes)?stel.core.landscapes.visible:'?');
      hudEl.textContent = 'yaw:' + yawDeg.toFixed(0) + '° pitch:' + pitchDeg.toFixed(0) + '° | lat:' + latDeg.toFixed(2) + ' lon:' + lonDeg.toFixed(2);
    }

    StelWebEngine({
      wasmFile: 'lib/stellarium-web-engine.wasm',
      canvas: document.getElementById('sky'),
      onReady: function(engine) {
        log('Engine ready');
        stel = engine;
        engineReady = true;
        statusEl.textContent = 'READY';
        statusEl.classList.add('done');

        var base = '/test-skydata/';
        stel.core.stars.addDataSource({ url: base + 'stars' });
        stel.core.skycultures.addDataSource({ url: base + 'skycultures/western', key: 'western' });
        stel.core.dsos.addDataSource({ url: base + 'dso' });
        stel.core.milkyway.addDataSource({ url: base + 'surveys/milkyway' });
        stel.core.planets.addDataSource({ url: base + 'surveys/sso/sun', key: 'sun' });
        stel.core.planets.addDataSource({ url: base + 'surveys/sso/moon', key: 'moon' });
        if (stel.core.landscapes) stel.core.landscapes.addDataSource({ url: base + 'landscapes/guereins', key: 'guereins' });

        if (stel.core.constellations) {
          stel.core.constellations.lines_visible = true;
          stel.core.constellations.labels_visible = true;
        }
        if (stel.core.atmosphere) stel.core.atmosphere.visible = false;
        if (stel.core.landscapes) stel.core.landscapes.visible = true;
        if (stel.core.lines) {
          if (stel.core.lines.equatorial) stel.core.lines.equatorial.visible = true;
          if (stel.core.lines.azimuthal) stel.core.lines.azimuthal.visible = true;
        }
        if (stel.core.stars) stel.core.stars.hints_visible = true;
        if (stel.core.planets) stel.core.planets.hints_visible = true;

        baseMJD = stel.date2MJD(new Date());
        stel.core.observer.utc = baseMJD;
        applyAll();
        updateDebug();
      },
      onError: function(err) {
        statusEl.textContent = 'ERROR: ' + (err && err.message ? err.message : String(err));
      }
    });

    function applyAll() {
      if (!engineReady) return;
      var obs = stel.core.observer;
      obs.latitude = (parseFloat(document.getElementById('lat').value) || 0) * Math.PI / 180;
      obs.longitude = (parseFloat(document.getElementById('lon').value) || 0) * Math.PI / 180;
      applyYaw();
      applyPitch();
      applyTime();
      applyOpacity();
      updateDebug();
    }

    function applyYaw() {
      var v = parseInt(document.getElementById('yaw').value) || 0;
      document.getElementById('yawVal').textContent = v + '°';
      if (engineReady) { stel.core.observer.yaw = v * Math.PI / 180; updateDebug(); }
    }
    function setYawQuick(d) {
      document.getElementById('yaw').value = d;
      applyYaw();
    }

    function applyPitch() {
      var v = parseInt(document.getElementById('pitch').value) || 0;
      document.getElementById('pitchVal').textContent = v + '°';
      if (engineReady) { stel.core.observer.pitch = v * Math.PI / 180; updateDebug(); }
    }
    function setPitchQuick(d) {
      document.getElementById('pitch').value = d;
      applyPitch();
    }

    function applyTime() {
      var m = parseInt(document.getElementById('timeOff').value) || 0;
      document.getElementById('timeVal').textContent = fmtTime(m);
      if (engineReady) {
        stel.core.observer.utc = stel.date2MJD(new Date()) + m / (24 * 60);
        updateDebug();
      }
    }
    function fmtTime(m) {
      if (m === 0) return 'now';
      var s = m > 0 ? '+' : '';
      var h = Math.floor(Math.abs(m) / 60);
      var r = Math.abs(m) % 60;
      if (h === 0) return s + r + 'm';
      if (r === 0) return s + h + 'h';
      return s + h + 'h' + r + 'm';
    }

    function applyOpacity() {
      var v = parseInt(document.getElementById('opacity').value) || 100;
      document.getElementById('opacityVal').textContent = v + '%';
      document.getElementById('sky').style.opacity = v / 100;
    }

    function toggle(pathA, pathB, btn) {
      if (!engineReady) return;
      var on = btn.classList.toggle('active');
      [pathA, pathB].filter(Boolean).forEach(function(p) {
        var parts = p.split('.');
        var obj = stel.core;
        for (var i = 0; i < parts.length; i++) obj = obj[parts[i]];
        if (obj) obj.visible = on;
      });
      updateDebug();
    }

    // --- Sensor simulation using deviceorientation ---
    var sensorSimActive = false;
    var simHeading = 0, simPitch = 45;

    function startSensorSim() {
      if (sensorSimActive) return;
      sensorSimActive = true;
      document.getElementById('btnSensor').classList.add('active');
      document.getElementById('btnSensor').textContent = 'Sensor ON';

      // Request permission on iOS
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(function(state) {
          if (state === 'granted') listenSensor();
          else log('Sensor permission denied');
        });
      } else {
        listenSensor();
      }
    }

    function listenSensor() {
      if (typeof AbsoluteOrientationSensor !== 'undefined') {
        try {
          var sensor = new AbsoluteOrientationSensor({ frequency: 60 });
          sensor.addEventListener('reading', function() {
            if (!sensorSimActive) { sensor.stop(); return; }
            var q = sensor.quaternion;
            var x = q[0], y = q[1], z = q[2], w = q[3];
            // Vanilla heading (same as ar-mode.js quatToHdg)
            var hdg = ((Math.atan2(2*(x*y + w*z), 1 - 2*(y*y + z*z)) * 180/Math.PI) + 360) % 360;
            // Vanilla pitch (same as ar-mode.js quatToAlt)
            var pitchDeg = Math.asin(Math.max(-1, Math.min(1, 2*(w*y - z*x)))) * 180 / Math.PI;
            var alt = Math.abs(pitchDeg);

            document.getElementById('yaw').value = Math.round(hdg);
            document.getElementById('yawVal').textContent = Math.round(hdg) + '°';
            document.getElementById('pitch').value = Math.round(alt);
            document.getElementById('pitchVal').textContent = Math.round(alt) + '°';

            if (engineReady) {
              stel.core.observer.yaw = -hdg * Math.PI / 180;
              stel.core.observer.pitch = alt * Math.PI / 180;
            }
            updateDebug();
          });
          sensor.addEventListener('error', function() {
            log('AbsoluteOrientationSensor error, falling back to deviceorientation');
            fallbackOrientation();
          });
          sensor.start();
          log('AbsoluteOrientationSensor started');
          return;
        } catch(e) { log('AbsoluteOrientationSensor exception: ' + e.message); }
      }
      fallbackOrientation();
    }

    function fallbackOrientation() {
      function handler(e) {
        if (!sensorSimActive) return;
        var raw = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : e.alpha;
        if (raw == null) return;
        var sa = (screen.orientation && screen.orientation.angle != null) ? screen.orientation.angle : (window.orientation || 0);
        raw = (raw - sa + 360) % 360;

        var beta = e.beta || 0;
        var alt = Math.abs(beta);

        document.getElementById('yaw').value = Math.round(raw);
        document.getElementById('yawVal').textContent = Math.round(raw) + '°';
        document.getElementById('pitch').value = Math.round(alt);
        document.getElementById('pitchVal').textContent = Math.round(alt) + '°';

        if (engineReady) {
          stel.core.observer.yaw = -raw * Math.PI / 180;
          stel.core.observer.pitch = alt * Math.PI / 180;
        }
        updateDebug();
      }
      window.addEventListener('deviceorientationabsolute', handler, true);
      window.addEventListener('deviceorientation', handler, true);
      log('deviceorientation fallback active');
    }

    function stopSensorSim() {
      sensorSimActive = false;
      document.getElementById('btnSensor').classList.remove('active');
      document.getElementById('btnSensor').textContent = 'Start Sensor';
    }
  </script>
</body>
</html>
