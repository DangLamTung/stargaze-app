<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#020618"/>
  <rect x="0" y="0" width="800" height="500" fill="url(#stars)" opacity="0.3"/>
  <defs><pattern id="stars" width="800" height="500" patternUnits="userSpaceOnUse">
    <circle cx="50" cy="30" r="0.8" fill="white"/><circle cx="150" cy="80" r="1" fill="white"/>
    <circle cx="300" cy="20" r="0.5" fill="white"/><circle cx="450" cy="60" r="1.2" fill="white"/>
    <circle cx="600" cy="40" r="0.7" fill="white"/><circle cx="750" cy="90" r="0.9" fill="white"/>
    <circle cx="100" cy="150" r="0.6" fill="white"/><circle cx="250" cy="200" r="1.1" fill="white"/>
    <circle cx="500" cy="130" r="0.8" fill="white"/><circle cx="680" cy="180" r="0.5" fill="white"/>
    <circle cx="80" cy="300" r="0.7" fill="white"/><circle cx="350" cy="350" r="1" fill="white"/>
    <circle cx="550" cy="280" r="0.6" fill="white"/><circle cx="720" cy="320" r="0.9" fill="white"/>
  </pattern></defs>
  <text x="400" y="160" text-anchor="middle" fill="#00d4ff" font-size="80">🔭</text>
  <text x="400" y="230" text-anchor="middle" fill="#e2e8f0" font-size="26" font-family="sans-serif" font-weight="bold">AR Sky View</text>
  <text x="400" y="270" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="sans-serif">Stellarium WASM · Real-time Stars · Constellations</text>
  <rect x="250" y="310" width="300" height="80" rx="16" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.25)"/>
  <text x="400" y="345" text-anchor="middle" fill="#64748b" font-size="14" font-family="sans-serif">📱 Point your phone camera at the sky</text>
  <text x="400" y="370" text-anchor="middle" fill="#64748b" font-size="14" font-family="sans-serif">Screenshot the AR mode → replace this file</text>
  <rect x="280" y="420" width="240" height="36" rx="18" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.35)"/>
  <text x="400" y="444" text-anchor="middle" fill="#00d4ff" font-size="14" font-family="sans-serif">Replace: docs/ar-sky-view.png</text>
</svg>
