<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification Test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #fff;
        padding: 20px;
        max-width: 500px;
        margin: 0 auto;
      }
      h2 {
        color: #0f0;
        margin-bottom: 12px;
      }
      .card {
        background: #1a1a2e;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
      }
      button {
        background: #0f0;
        color: #000;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        margin: 4px;
      }
      button:disabled {
        opacity: 0.4;
      }
      button.danger {
        background: #f44;
        color: #fff;
      }
      button.warn {
        background: #fa0;
        color: #000;
      }
      .log {
        background: #000;
        color: #0f0;
        font-family: monospace;
        font-size: 12px;
        padding: 10px;
        border-radius: 6px;
        margin-top: 12px;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      .info {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }
      .status {
        font-weight: bold;
      }
      .granted {
        color: #0f0;
      }
      .denied {
        color: #f44;
      }
      .default {
        color: #fa0;
      }
    </style>
  </head>
  <body>
    <h2>🔔 Notification API Test</h2>

    <div class="card">
      <strong>Permission status:</strong>
      <span id="permStatus" class="status">checking...</span>
      <div class="info" id="permInfo"></div>
    </div>

    <div class="card">
      <button onclick="requestPerm()">Request Permission</button>
      <button onclick="sendBasic()">Send Basic Notification</button>
      <button onclick="sendTimed()">Send Timed (3s delay)</button>
      <button onclick="sendMany()" class="warn">Send 3 in a row</button>
      <button onclick="sendWithIcon()" class="danger">Send with emoji icon (should fail)</button>
    </div>

    <div class="card">
      <strong>Service Worker:</strong>
      <span id="swStatus">checking...</span>
      <button onclick="registerSW()" style="font-size: 12px; padding: 4px 8px">Register SW</button>
    </div>

    <div class="log" id="log">Waiting...</div>

    <script>
      var logEl = document.getElementById('log');
      function log(msg) {
        var t = new Date().toLocaleTimeString();
        logEl.textContent += '[' + t + '] ' + msg + '\n';
        logEl.scrollTop = logEl.scrollHeight;
        console.log('[NTF]', msg);
      }

      function updateStatus() {
        var s = document.getElementById('permStatus');
        s.textContent = Notification.permission;
        s.className = 'status ' + Notification.permission;
        document.getElementById('permInfo').textContent =
          'Notification in window: ' +
          ('Notification' in window) +
          '\n' +
          'serviceWorker in navigator: ' +
          ('serviceWorker' in navigator) +
          '\n' +
          'navigator.userAgent: ' +
          navigator.userAgent.substring(0, 60);
      }
      updateStatus();

      if (!('Notification' in window)) {
        log('ERROR: Notification API not available');
      } else {
        log('Notification API available. Permission: ' + Notification.permission);
      }

      async function requestPerm() {
        try {
          // Try promise-based API (modern)
          var result = await Notification.requestPermission();
          log('requestPermission() returned: ' + result);
          updateStatus();
        } catch (e) {
          // Fallback to callback-based API (older browsers)
          log('Promise API failed: ' + e.message + ', trying callback...');
          try {
            Notification.requestPermission(function (result) {
              log('requestPermission(callback) returned: ' + result);
              updateStatus();
            });
          } catch (e2) {
            log('Callback API also failed: ' + e2.message);
          }
        }
        if (Notification.permission === 'denied') {
          log('TIP: On Android Chrome, go to Site Settings → Notifications → Allow');
          log('     Tap the lock icon in the address bar to find it.');
        }
      }

      function sendBasic() {
        if (Notification.permission !== 'granted') {
          log('SKIP: permission not granted');
          return;
        }
        try {
          var n = new Notification('🔭 Basic Test', { body: 'This is a basic notification from the test page.' });
          log('Basic notification CREATED');
          setTimeout(function () {
            n.close();
          }, 5000);
        } catch (e) {
          log('Basic notification FAILED: ' + e.message);
        }
      }

      function sendTimed() {
        if (Notification.permission !== 'granted') {
          log('SKIP: permission not granted');
          return;
        }
        log('Scheduling notification in 3 seconds...');
        setTimeout(function () {
          try {
            var n = new Notification('⏰ Timed Notification', { body: 'This appeared after 3 seconds.' });
            log('Timed notification CREATED');
            setTimeout(function () {
              n.close();
            }, 5000);
          } catch (e) {
            log('Timed notification FAILED: ' + e.message);
          }
        }, 3000);
      }

      function sendMany() {
        if (Notification.permission !== 'granted') {
          log('SKIP: permission not granted');
          return;
        }
        for (var i = 1; i <= 3; i++) {
          (function (j) {
            setTimeout(function () {
              try {
                var n = new Notification('Notification #' + j, {
                  body: 'This is notification number ' + j,
                  tag: 'test-' + j,
                });
                log('Notification #' + j + ' CREATED');
                setTimeout(function () {
                  n.close();
                }, 3000);
              } catch (e) {
                log('Notification #' + j + ' FAILED: ' + e.message);
              }
            }, j * 500);
          })(i);
        }
      }

      function sendWithIcon() {
        if (Notification.permission !== 'granted') {
          log('SKIP: permission not granted');
          return;
        }
        try {
          var n = new Notification('Icon Test', { body: 'This has an emoji icon', icon: '🔭', badge: '⭐' });
          log('Icon notification CREATED (unexpected!)');
          setTimeout(function () {
            n.close();
          }, 3000);
        } catch (e) {
          log('Icon notification FAILED (expected): ' + e.message);
        }
      }

      // Service worker check
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          document.getElementById('swStatus').textContent = regs.length + ' registered';
          log('SW registrations: ' + regs.length);
        });
      } else {
        document.getElementById('swStatus').textContent = 'not available';
      }

      function registerSW() {
        log('Service worker registration not implemented in test page');
      }
    </script>
  </body>
</html>
