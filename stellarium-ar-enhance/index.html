<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>StarGaze AR — Sky Viewer</title>
  <link rel="stylesheet" href="src/ar.css?v=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>" />
</head>
<body>
  <div id="ar-overlay" class="ar-overlay hidden">
    <video id="ar-video" autoplay playsinline muted></video>
    <canvas id="ar-sky" class="ar-sky-container"></canvas>
    <div class="ar-hud">
      <!-- Compass -->
      <div class="ar-compass" id="ar-compass-ring">
        <div class="ar-compass-face">
          <div class="ar-compass-tick" style="transform:rotate(0deg)"><span>N</span></div>
          <div class="ar-compass-tick" style="transform:rotate(30deg)"></div>
          <div class="ar-compass-tick" style="transform:rotate(60deg)"></div>
          <div class="ar-compass-tick" style="transform:rotate(90deg)"><span>E</span></div>
          <div class="ar-compass-tick" style="transform:rotate(120deg)"></div>
          <div class="ar-compass-tick" style="transform:rotate(150deg)"></div>
          <div class="ar-compass-tick" style="transform:rotate(180deg)"><span>S</span></div>
          <div class="ar-compass-tick" style="transform:rotate(210deg)"></div>
          <div class="ar-compass-tick" style="transform:rotate(240deg)"></div>
          <div class="ar-compass-tick" style="transform:rotate(270deg)"><span>W</span></div>
          <div class="ar-compass-tick" style="transform:rotate(300deg)"></div>
          <div class="ar-compass-tick" style="transform:rotate(330deg)"></div>
        </div>
        <div class="ar-compass-needle"></div>
      </div>
      <div class="ar-crosshair">➕</div>

      <!-- Lens indicator -->
      <div class="ar-lens-indicator" id="ar-lens-indicator">
        <div class="ar-lens-ring" id="ar-lens-ring"></div>
        <div class="ar-lens-info">
          <span class="ar-lens-mm" id="ar-lens-mm">50mm</span>
          <span class="ar-lens-label" id="ar-lens-label">NORMAL</span>
          <span class="ar-lens-fov" id="ar-lens-fov">f/40&deg;</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="ar-controls" id="ar-controls">
        <button class="ar-controls-toggle" id="ar-controls-toggle">&blacktriangle;</button>
        <div class="ar-slider-row">
          <label style="font-size:10px;color:#888;min-width:44px;text-transform:uppercase;letter-spacing:1px">Sky</label>
          <input type="range" id="ar-opacity" min="5" max="100" value="92" />
          <span class="ar-ctrl-val" id="ar-opacity-val">92%</span>
        </div>
        <div class="ar-slider-row">
          <label style="font-size:10px;color:#888;min-width:44px;text-transform:uppercase;letter-spacing:1px">Glow</label>
          <input type="range" id="ar-brightness" min="100" max="400" value="150" />
          <span class="ar-ctrl-val" id="ar-brightness-val">1.5×</span>
        </div>
        <div class="ar-toggle-row">
          <button id="ar-btn-atmo" class="ar-toggle-btn" title="Atmosphere: blue sky glow">&#x1F305;</button>
          <button id="ar-btn-ground" class="ar-toggle-btn active" title="Ground & landscape">&#x26F0;</button>
          <button id="ar-btn-grid" class="ar-toggle-btn" title="Grid lines: RA/Dec & Az/Alt">&#x1F4D0;</button>
          <button id="ar-btn-mask" class="ar-toggle-btn" title="Horizon mask: hide stars below ground line">&#x1F313;</button>
        </div>

        <!-- Time/Date panel -->
        <div class="ar-time-panel" style="border-top:1px solid rgba(255,255,255,0.06);padding-top:6px;margin-top:4px">
          <div style="display:flex;align-items:center;gap:3px;justify-content:center">
            <button class="ar-adj-btn" id="ar-yr-up" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:32px">▲</button>
            <button class="ar-adj-btn" id="ar-mo-up" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▲</button>
            <button class="ar-adj-btn" id="ar-dy-up" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▲</button>
            <span style="width:14px"></span>
            <button class="ar-adj-btn" id="ar-h-up" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▲</button>
            <button class="ar-adj-btn" id="ar-m-up" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▲</button>
            <button class="ar-adj-btn" id="ar-s-up" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▲</button>
          </div>
          <div style="display:flex;align-items:center;gap:3px;justify-content:center;font-family:monospace;font-size:14px;color:#fff;padding:2px 0">
            <span id="ar-yr" style="min-width:34px;text-align:center">----</span>
            <span style="color:#888">-</span>
            <span id="ar-mo" style="min-width:22px;text-align:center">--</span>
            <span style="color:#888">-</span>
            <span id="ar-dy" style="min-width:22px;text-align:center">--</span>
            <span style="width:10px"></span>
            <span id="ar-h" style="min-width:22px;text-align:center">--</span>
            <span style="color:#888">:</span>
            <span id="ar-m" style="min-width:22px;text-align:center">--</span>
            <span style="color:#888">:</span>
            <span id="ar-s" style="min-width:22px;text-align:center">--</span>
            <span id="ar-time-offset" style="font-size:10px;color:#00d4ff;margin-left:6px;font-family:monospace;min-width:28px"></span>
          </div>
          <div style="display:flex;align-items:center;gap:3px;justify-content:center">
            <button class="ar-adj-btn" id="ar-yr-down" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:32px">▼</button>
            <button class="ar-adj-btn" id="ar-mo-down" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▼</button>
            <button class="ar-adj-btn" id="ar-dy-down" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▼</button>
            <span style="width:14px"></span>
            <button class="ar-adj-btn" id="ar-h-down" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▼</button>
            <button class="ar-adj-btn" id="ar-m-down" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▼</button>
            <button class="ar-adj-btn" id="ar-s-down" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ccc;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:4px;min-width:28px">▼</button>
          </div>
          <div style="display:flex;align-items:center;gap:6px;justify-content:center;margin-top:4px">
            <div style="position:relative;flex:1;height:24px;display:flex;align-items:center">
              <span id="ar-moon-rise-marker" style="position:absolute;font-size:9px;top:-8px;transform:translateX(-50%);pointer-events:none">🌙↑</span>
              <input type="range" id="ar-daylight" min="0" max="1439" value="720" style="flex:1;height:6px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,#87CEEB 0%,#87CEEB 12%,#4a7090 12%,#4a7090 20%,#0d1428 20%,#0d1428 80%,#4a7090 80%,#4a7090 88%,#87CEEB 88%,#87CEEB 100%);border-radius:3px;outline:none">
              <span id="ar-moon-set-marker" style="position:absolute;font-size:9px;top:-8px;transform:translateX(-50%);pointer-events:none">🌙↓</span>
            </div>
          </div>
          <div id="ar-moon-subtitle" style="font-size:9px;color:#888;text-align:center;margin-top:2px">☀️ Daylight</div>
        </div>
      </div>

      <button class="ar-close-btn" id="ar-close-btn">&times;</button>
      <button class="ar-calibrate-btn" id="ar-calibrate-btn">&#x1F9ED;</button>
      <button class="ar-capture-btn" id="ar-capture-btn">&#x1F4F8;</button>
      <button class="ar-bortle-btn" id="ar-bortle-btn">&#x1F52D;</button>

      <div id="ar-debug"></div>
    </div>
  </div>

  <!-- Start button -->
  <div id="start-screen" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020618;color:#e2e8f0;font-family:system-ui;z-index:9000;gap:20px">
    <h1 style="font-size:2rem">&#x1F52D; StarGaze AR</h1>
    <p style="color:#64748b">Point your phone at the sky to see stars</p>
    <button id="start-btn" style="padding:16px 40px;font-size:1.2rem;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;cursor:pointer">&#x1F4F7; Open AR Camera</button>
  </div>

  <script type="module" src="src/ar-app.js?v=1"></script>
</body>
</html>
