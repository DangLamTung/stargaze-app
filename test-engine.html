<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellarium Engine Test</title>
  <style>
    body { margin:0; background:#000; color:#0f0; font-family:monospace; }
    #status { position:fixed; top:10px; left:10px; z-index:10; font-size:14px; background:rgba(0,0,0,0.7); padding:8px; border-radius:4px; }
    canvas { display:block; width:100vw; height:100vh; }
    .controls { position:fixed; bottom:10px; left:10px; z-index:10; }
    button { margin:4px; padding:8px 16px; font-size:14px; }
  </style>
</head>
<body>
  <div id="status">Loading engine...</div>
  <canvas id="sky"></canvas>
  <div class="controls">
    <button onclick="setAz(0)">N</button>
    <button onclick="setAz(90)">E</button>
    <button onclick="setAz(180)">S</button>
    <button onclick="setAz(270)">W</button>
    <input type="range" id="az-slider" min="0" max="360" value="0" oninput="setAz(this.value)" style="width:200px" />
    <span id="az-label">0°</span>
  </div>

  <script src="lib/stellarium-web-engine.js"></script>
  <script>
    var statusEl = document.getElementById('status');
    function log(msg) { statusEl.textContent = msg; console.log(msg); }

    log('StelWebEngine type: ' + typeof StelWebEngine);

    if (typeof StelWebEngine === 'undefined') {
      log('ERROR: StelWebEngine not defined - check script src');
    } else {
      log('Calling StelWebEngine...');
      try {
        StelWebEngine({
          wasmFile: 'lib/stellarium-web-engine.wasm',
          canvas: document.getElementById('sky'),
          onReady: function(engine) {
            log('ENGINE READY!');
            window._stel = engine;

            // Check what's available
            var keys = Object.keys(engine);
            log('Top keys: ' + keys.join(', '));

            if (engine.core) {
              log('core found');
              var ck = Object.keys(engine.core);
              log('core keys: ' + ck.join(', '));

              if (engine.core.observer) {
                log('observer found');
                var ok = Object.keys(engine.core.observer);
                log('observer keys: ' + ok.join(', '));

                // Set position
                engine.core.observer.latitude = 10.762622;
                engine.core.observer.longitude = 106.660172;
                log('Position set to HCMC');

                // Try setting yaw
                if ('yaw' in engine.core.observer) {
                  engine.core.observer.yaw = 0;
                  log('yaw property exists, set to 0');
                } else {
                  log('WARN: no yaw property on observer');
                }

                // Try setting pitch
                if ('pitch' in engine.core.observer) {
                  engine.core.observer.pitch = 45 * Math.PI / 180;
                  log('pitch property exists');
                } else {
                  log('WARN: no pitch property');
                }

                // List all observer properties
                var props = [];
                for (var k in engine.core.observer) {
                  try { props.push(k + '=' + engine.core.observer[k]); } catch(e) {}
                }
                log('observer values: ' + props.join(', '));
              } else {
                log('ERROR: no core.observer');
              }
            } else {
              log('ERROR: no core object');
            }
          },
          onError: function(err) {
            log('ENGINE ERROR: ' + (err && err.message ? err.message : err));
          }
        });
      } catch(e) {
        log('EXCEPTION: ' + e.message);
      }
    }

    function setAz(deg) {
      document.getElementById('az-slider').value = deg;
      document.getElementById('az-label').textContent = deg + '°';
      if (window._stel && window._stel.core && window._stel.core.observer) {
        window._stel.core.observer.yaw = deg * Math.PI / 180;
        log('yaw set to ' + deg + '°');
      } else {
        log('Engine not ready yet');
      }
    }
  </script>
</body>
</html>
