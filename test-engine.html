<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellarium Engine Test</title>
  <style>
    body { margin:0; background:#000; color:#0f0; font-family:monospace; }
    #status { position:fixed; top:10px; left:10px; z-index:10; font-size:14px; background:rgba(0,0,0,0.7); padding:8px; border-radius:4px; }
    canvas { display:block; width:100vw; height:100vh; }
    .controls { position:fixed; bottom:10px; left:10px; z-index:10; }
    button { margin:4px; padding:8px 16px; font-size:14px; }
  </style>
</head>
<body>
  <div id="status">Loading engine...</div>
  <canvas id="sky"></canvas>
  <div class="controls">
    <button onclick="setAz(0)">N</button>
    <button onclick="setAz(90)">E</button>
    <button onclick="setAz(180)">S</button>
    <button onclick="setAz(270)">W</button>
    <input type="range" id="az-slider" min="0" max="360" value="0" oninput="setAz(this.value)" style="width:200px" />
    <span id="az-label">0°</span>
  </div>

  <script src="lib/stellarium-web-engine.js"></script>
  <script>
    var statusEl = document.getElementById('status');
    function log(msg) { console.log('[TEST]', msg); statusEl.textContent = msg; }

    log('StelWebEngine type: ' + typeof StelWebEngine);

    if (typeof StelWebEngine === 'undefined') {
      log('ERROR: StelWebEngine not defined - check script src path');
    } else {
      log('Calling StelWebEngine (this can only be called ONCE)...');
      try {
        StelWebEngine({
          wasmFile: 'lib/stellarium-web-engine.wasm',
          canvas: document.getElementById('sky'),
          onReady: function(engine) {
            log('ENGINE READY! Loading star catalogs...');
            window._stel = engine;

            if (!engine.core) { log('ERROR: no core'); return; }
            if (!engine.core.observer) { log('ERROR: no observer'); return; }

            // Load catalogs
            var base = 'https://d3ufh70wg9uzo4.cloudfront.net/skydata/';
            engine.core.stars.addDataSource({ url: base + 'stars' });
            engine.core.skycultures.addDataSource({ url: base + 'skycultures/western', key: 'western' });
            engine.core.dsos.addDataSource({ url: base + 'dso' });

            // Set observer
            engine.core.observer.latitude = 10.762622;
            engine.core.observer.longitude = 106.660172;
            engine.core.observer.pitch = 45 * Math.PI / 180;
            engine.core.observer.yaw = 0;

            log('READY! Stars should appear. Use buttons below to rotate.');
          },
          onError: function(err) {
            log('ENGINE ERROR: ' + (err && err.message ? err.message : String(err)));
          }
        });
      } catch(e) {
        log('EXCEPTION: ' + e.message + ' (stack: ' + e.stack + ')');
      }
    }

    function setAz(deg) {
      document.getElementById('az-slider').value = deg;
      document.getElementById('az-label').textContent = deg + '\u00b0';
      var s = window._stel;
      if (s && s.core && s.core.observer) {
        s.core.observer.yaw = deg * Math.PI / 180;
        log('yaw -> ' + deg + '\u00b0');
      } else {
        log('Engine not ready yet (wait for star catalogs to load)');
      }
    }
  </script>
</body>
</html>
