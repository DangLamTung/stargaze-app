<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AR Lens Math Test</title>
    <link rel="stylesheet" href="src/styles/main.css?v=19" />
    <style>
      body {
        font-family: monospace;
        background: #111;
        color: #0f0;
        padding: 20px;
      }
      .pass {
        color: #0f0;
      }
      .fail {
        color: #f00;
      }
      .info {
        color: #0ff;
      }
      table {
        border-collapse: collapse;
        margin: 10px 0;
      }
      td,
      th {
        border: 1px solid #333;
        padding: 4px 10px;
        text-align: right;
      }
      th {
        color: #0ff;
      }
    </style>
  </head>
  <body>
    <h2>🔭 AR Lens Focus Simulation — Math Verification</h2>
    <div id="results"></div>

    <script type="module">
      // Directly test the lens math from ar-mode.js constants
      const SENSOR_W = 36; // full-frame horizontal

      function fovToFocalLength(fovDeg) {
        return Math.round(SENSOR_W / (2 * Math.tan((fovDeg * Math.PI) / 360)));
      }
      function focalLengthToFov(fl) {
        return Math.round((2 * Math.atan(SENSOR_W / (2 * fl)) * 180) / Math.PI);
      }

      function getLensClass(fl) {
        if (fl <= 18) return 'wide';
        if (fl <= 35) return 'normal';
        if (fl <= 85) return 'tele';
        return 'super';
      }

      function getLensLabel(fl) {
        if (fl <= 14) return 'FISHEYE';
        if (fl <= 18) return 'ULTRA WIDE';
        if (fl <= 24) return 'WIDE';
        if (fl <= 35) return 'STANDARD';
        if (fl <= 60) return 'NORMAL';
        if (fl <= 85) return 'PORTRAIT';
        if (fl <= 135) return 'TELE';
        if (fl <= 200) return 'SUPER TELE';
        return 'EXTREME';
      }

      // Test cases: [fov, expectedFocal, expectedLabel, expectedClass]
      // Label thresholds: ≤14=FISHEYE ≤18=ULTRA WIDE ≤24=WIDE ≤35=STANDARD ≤60=NORMAL ≤85=PORTRAIT ≤135=TELE ≤200=SUPER TELE
      // Class thresholds: ≤18=wide ≤35=normal ≤85=tele >85=super
      const tests = [
        [120, 10, 'FISHEYE', 'wide'],
        [104, 14, 'FISHEYE', 'wide'],
        [90, 18, 'ULTRA WIDE', 'wide'],
        [74, 24, 'WIDE', 'normal'],
        [60, 31, 'STANDARD', 'normal'],
        [54, 35, 'STANDARD', 'normal'],
        [40, 49, 'NORMAL', 'tele'],
        [30, 67, 'PORTRAIT', 'tele'],
        [24, 85, 'PORTRAIT', 'tele'],
        [20, 102, 'TELE', 'super'],
        [15, 137, 'SUPER TELE', 'super'],
        [10, 206, 'EXTREME', 'super'],
        [8, 257, 'EXTREME', 'super'],
      ];

      // Additional: verify round-trip
      const roundTrips = [
        [50, 40], // 50mm lens → ~40° FOV
        [85, 24], // 85mm → ~24°
        [135, 15], // 135mm → ~15°
        [200, 10], // 200mm → ~10°
        [14, 104], // 14mm → ~104°
        [24, 74], // 24mm → ~74°
        [35, 54], // 35mm → ~54°
      ];

      let html = '';
      let allPass = true;

      // Forward tests
      html +=
        '<h3>FOV → Focal Length</h3><table><tr><th>FOV</th><th>Expected mm</th><th>Computed mm</th><th>Label</th><th>Class</th></tr>';
      for (const [fov, expMm, expLabel, expClass] of tests) {
        const mm = fovToFocalLength(fov);
        const label = getLensLabel(mm);
        const cls = getLensClass(mm);
        const passes = mm === expMm && label === expLabel && cls === expClass;
        if (!passes) allPass = false;
        html += `<tr class="${passes ? 'pass' : 'fail'}">
    <td>${fov}°</td><td>${expMm}mm</td><td>${mm}mm</td>
    <td>${label}</td><td>${cls}</td>
    <td>${passes ? '✅' : '❌'}</td></tr>`;
      }
      html += '</table>';

      // Round-trip tests
      html +=
        '<h3>Round-trip: Focal Length → FOV → Focal Length</h3><table><tr><th>Lens</th><th>→ FOV</th><th>→ back to mm</th><th>Match?</th></tr>';
      for (const [fl, expectedFov] of roundTrips) {
        const fov = focalLengthToFov(fl);
        const back = fovToFocalLength(fov);
        const passes = fov === expectedFov || Math.abs(fov - expectedFov) <= 1;
        if (!passes) allPass = false;
        html += `<tr class="${passes ? 'pass' : 'fail'}">
    <td>${fl}mm</td><td>${fov}° (expect ~${expectedFov}°)</td>
    <td>${back}mm</td>
    <td>${passes ? '✅' : '❌'}</td></tr>`;
      }
      html += '</table>';

      // Edge cases
      html += '<h3>Edge Cases</h3><table><tr><th>Test</th><th>Result</th></tr>';
      const edgeCases = [
        ['FOV 1°', 'f=' + fovToFocalLength(1) + 'mm', 'Expected ~2063mm (very telephoto)'],
        ['FOV 179°', 'f=' + fovToFocalLength(179) + 'mm', 'Expected ~0mm (nearly 180°)'],
        ['FOV 0.5°', 'f=' + fovToFocalLength(0.5) + 'mm', 'Expected ~4125mm'],
        ['getLensLabel(14)', '= ' + getLensLabel(14) + ' → FISHEYE?', getLensLabel(14) === 'FISHEYE'],
        ['getLensLabel(15)', '= ' + getLensLabel(15) + ' → ULTRA WIDE?', getLensLabel(15) === 'ULTRA WIDE'],
        ['getLensLabel(18)', '= ' + getLensLabel(18) + ' → ULTRA WIDE?', getLensLabel(18) === 'ULTRA WIDE'],
        ['getLensLabel(19)', '= ' + getLensLabel(19) + ' → WIDE?', getLensLabel(19) === 'WIDE'],
        ['getLensLabel(200)', '= ' + getLensLabel(200) + ' → SUPER TELE?', getLensLabel(200) === 'SUPER TELE'],
        ['getLensLabel(201)', '= ' + getLensLabel(201) + ' → EXTREME?', getLensLabel(201) === 'EXTREME'],
      ];
      for (const [name, result, expected] of edgeCases) {
        const passes = typeof expected === 'boolean' ? expected : true;
        html += `<tr class="${passes ? 'pass' : 'fail'}"><td>${name}</td><td>${result}</td><td>${passes ? '✅' : '❌'}</td></tr>`;
      }
      html += '</table>';

      // Ring sizes
      html += '<h3>CSS Ring Size Matrix (tested in browser)</h3>';
      html += '<table><tr><th>Class</th><th>Width</th><th>Height</th></tr>';
      const ringEl = document.createElement('div');
      ringEl.className = 'ar-lens-ring';
      document.body.appendChild(ringEl);
      for (const cls of ['wide', 'normal', 'tele', 'super']) {
        ringEl.className = 'ar-lens-ring ' + cls;
        const s = getComputedStyle(ringEl);
        html += `<tr><td>.${cls}</td><td>${s.width}</td><td>${s.height}</td></tr>`;
      }
      document.body.removeChild(ringEl);
      html += '</table>';

      html += `<h2 class="${allPass ? 'pass' : 'fail'}">${allPass ? '✅ ALL TESTS PASSED' : '❌ SOME TESTS FAILED'}</h2>`;

      document.getElementById('results').innerHTML = html;
    </script>
  </body>
</html>
